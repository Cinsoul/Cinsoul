<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="How Aria works: intent, plan, act, verify, result">
<rect width="960" height="330" rx="14" fill="#ffffff"/>
<text x="480.0" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#59636e">HOW ARIA WORKS</text>
<rect x="24" y="92" width="168" height="118" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="40" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">01</text>
<text x="40" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2328">Intent</text>
<text x="40" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">what you ask,</text>
<text x="40" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">in plain words</text>
<path d="M195 151 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#59636e" stroke-width="1.5"/>
<rect x="213" y="92" width="168" height="118" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="229" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">02</text>
<text x="229" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2328">Plan</text>
<text x="229" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">reads the project</text>
<text x="229" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">and the data first</text>
<path d="M384 151 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#59636e" stroke-width="1.5"/>
<rect x="402" y="92" width="168" height="118" rx="10" fill="#f6f8fa" stroke="#2f6f8f" stroke-width="1.5"/>
<text x="418" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">03</text>
<text x="418" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2328">Act</text>
<text x="418" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">edits files, runs</text>
<text x="418" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">tools and commands</text>
<path d="M573 151 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#59636e" stroke-width="1.5"/>
<rect x="591" y="92" width="168" height="118" rx="10" fill="#f6f8fa" stroke="#2f6f8f" stroke-width="1.5"/>
<text x="607" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">04</text>
<text x="607" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2328">Verify</text>
<text x="607" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">tests must pass;</text>
<text x="607" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">numbers cite sources</text>
<path d="M762 151 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#59636e" stroke-width="1.5"/>
<rect x="780" y="92" width="168" height="118" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="796" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">05</text>
<text x="796" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2328">Result</text>
<text x="796" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">a change or report</text>
<text x="796" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">you can check</text>
<line x1="391.5" y1="78" x2="391.5" y2="224" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="391.5" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9a6700">you approve</text>
<line x1="24" y1="246" x2="936" y2="246" stroke="#d0d7de"/>
<text x="40" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#59636e">MODELS</text>
<text x="144" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">local (Ollama) or cloud: Gemini and Gemma on Google Cloud, and more</text>
<text x="40" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#59636e">WORKS IN</text>
<text x="144" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">Code  ·  Finance  ·  Logistics</text>
</svg>