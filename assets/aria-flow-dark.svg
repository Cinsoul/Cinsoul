<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="How Aria works: intent, plan, act, verify, result">
<rect width="960" height="330" rx="14" fill="#0d1117"/>
<text x="480.0" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#8b949e">HOW ARIA WORKS</text>
<rect x="24" y="92" width="168" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="40" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">01</text>
<text x="40" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Intent</text>
<text x="40" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">what you ask,</text>
<text x="40" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">in plain words</text>
<path d="M195 151 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#8b949e" stroke-width="1.5"/>
<rect x="213" y="92" width="168" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="229" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">02</text>
<text x="229" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Plan</text>
<text x="229" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">reads the project</text>
<text x="229" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">and the data first</text>
<path d="M384 151 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#8b949e" stroke-width="1.5"/>
<rect x="402" y="92" width="168" height="118" rx="10" fill="#161b22" stroke="#88c0d0" stroke-width="1.5"/>
<text x="418" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">03</text>
<text x="418" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Act</text>
<text x="418" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">edits files, runs</text>
<text x="418" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">tools and commands</text>
<path d="M573 151 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#8b949e" stroke-width="1.5"/>
<rect x="591" y="92" width="168" height="118" rx="10" fill="#161b22" stroke="#88c0d0" stroke-width="1.5"/>
<text x="607" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">04</text>
<text x="607" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Verify</text>
<text x="607" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">tests must pass;</text>
<text x="607" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">numbers cite sources</text>
<path d="M762 151 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#8b949e" stroke-width="1.5"/>
<rect x="780" y="92" width="168" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="796" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">05</text>
<text x="796" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Result</text>
<text x="796" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">a change or report</text>
<text x="796" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">you can check</text>
<line x1="391.5" y1="78" x2="391.5" y2="224" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="391.5" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#d29922">you approve</text>
<line x1="24" y1="246" x2="936" y2="246" stroke="#30363d"/>
<text x="40" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#8b949e">MODELS</text>
<text x="144" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#e6edf3">local (Ollama) or cloud: Gemini and Gemma on Google Cloud, and more</text>
<text x="40" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#8b949e">WORKS IN</text>
<text x="144" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#e6edf3">Code  ·  Finance  ·  Logistics</text>
</svg>